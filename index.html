<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Empty one</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui; }
      #toolbar {
        position: fixed; top: 12px; left: 12px;
        display: flex; gap: 6px; padding: 8px;
        background: rgba(23, 27, 36, 0.9);
        border: 1px solid #2a2f3a;
        border-radius: 8px;
        z-index: 10;
      }
      #toolbar button {
        background: #2a2f3a; color: #cfd5de;
        border: 1px solid #4a505c; border-radius: 4px;
        padding: 6px 12px; cursor: pointer;
        font-family: inherit;
      }
      #toolbar button:hover { background: #4a505c; }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button data-add="router">Router</button>
      <button data-add="firewall">Firewall</button>
      <button data-add="server">Server</button>
      <button data-add="client">Client</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
