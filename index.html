<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Network Architect</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <!-- Верхняя панель (Статус) -->
  <div id="top-bar">
    <div class="stat">Бюджет: <span id="ui-budget" style="color: #4ade80;">$0</span></div>
    <div class="stat">Доход: <span id="ui-income" style="color: #4ade80;">+$0/с</span></div>
    <div class="stat">Расход: <span id="ui-upkeep" style="color: #f87171;">-$0/с</span></div>
    <div class="stat">Время: NAN</div>
  </div>

  <!-- Левая панель (Каталог) -->
  <div id="catalog">
    <h3>Оборудование</h3>
    <button data-add="router">Роутер</button>
    <button data-add="firewall">Фаервол</button>
    <button data-add="server">Сервер</button>
    <button data-add="client">Клиент</button>
    <button data-add="crypto">СКЗИ</button>
    <button data-add="ids">IDS/IPS</button>
  </div>

  <!-- Inspector  -->
  <div id="inspector">
    <h3>Инспектор</h3>
    <div id="inspector-content" class="empty-msg">
      Выберите устройство на схеме для просмотра деталей.
    </div>
  </div>

  <!-- Нижняя панель (Инструменты) -->
  <div id="bottom-bar">
    <button id="mode-pan" class="active">Pan</button>
    <button id="mode-connect">Connection</button>
  </div>s

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
